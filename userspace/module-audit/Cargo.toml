[package]
name = "ksu-module-audit"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8", features = ["deflate", "deflate64", "time", "lzma", "xz"], default-features = false }

[[bin]]
name = "ksu-module-audit"
path = "src/main.rs"
